name: CI

on:
  pull_request:

jobs:
  uv-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv check
        working-directory: apps/backend
        run: uv check --locked --preview-features check-command

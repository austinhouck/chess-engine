name: CI

on:
  pull_request:

jobs:
  uv-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv check
        working-directory: apps/backend
        run: uv check --locked --preview-features check-command

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        working-directory: apps/backend
        run: |
          set -o pipefail
          uv run pytest --junitxml=pytest.xml | tee pytest-coverage.txt

      # Coverage data + reports handed off to the `coverage` job, which runs
      # on a separate runner with no access to this job's filesystem.
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            apps/backend/.coverage
            apps/backend/pytest-coverage.txt
            apps/backend/pytest.xml

  coverage:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: apps/backend

      - name: Require 80% coverage
        working-directory: apps/backend
        run: uv run coverage report --fail-under=80

      - name: Comment coverage on PR
        if: always()
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: apps/backend/pytest-coverage.txt
          junitxml-path: apps/backend/pytest.xml
